<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shaley Gardens</title>
    <meta name="description" content="A quiet garden where you can talk with Shaley. She remembers the conversation while you visit.">
    <meta name="theme-color" content="#1f4a38">
    <meta property="og:title" content="Shaley Gardens">
    <meta property="og:description" content="A quiet garden where you can talk with Shaley. She remembers the conversation while you visit.">
    <meta property="og:image" content="https://shaleygardens.com/assets/shaley.jpg">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="canonical" href="https://shaleygardens.com/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,650;0,6..12,750&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #24312b;
            --muted: #5d6b62;
            --leaf: #1f4a38;
            --leaf-deep: #17382b;
            --moss: #6e8a72;
            --cream: #f4efe4;
            --paper: rgba(255, 253, 248, 0.92);
            --sand: #efe4d2;
            --blossom: #f3d7cb;
            --gold: #8d6b32;
            --line: rgba(36, 49, 43, 0.12);
            --shadow: 0 16px 40px rgba(36, 49, 43, 0.08);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Nunito Sans", "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 420px at 0% -10%, rgba(243, 215, 203, 0.85), transparent 60%),
                radial-gradient(700px 380px at 100% 0%, rgba(198, 176, 112, 0.35), transparent 55%),
                linear-gradient(180deg, #e6f0e2 0%, var(--cream) 42%, #f7f1e6 100%);
            min-height: 100dvh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(31, 74, 56, 0.08) 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent 70%);
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 16px 16px calc(12px + env(safe-area-inset-bottom));
        }

        .site-header { padding: 4px 4px 12px; }

        .eyebrow {
            margin: 0 0 2px;
            color: var(--moss);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(2rem, 7vw, 3.4rem);
            font-weight: 650;
            letter-spacing: -0.03em;
            line-height: 1.02;
            color: var(--leaf-deep);
        }

        .layout {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .host, .chat {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .host {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr);
            gap: 4px 12px;
            align-items: center;
            padding: 12px;
        }

        .portrait-wrap {
            grid-row: 1 / span 3;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(160deg, #f3d7cb, #8d6b32 45%, #1f4a38);
        }

        .portrait {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 18%;
            background: var(--sand);
        }

        .portrait-wrap.speaking { animation: glow 1.4s ease-in-out infinite; }
        .portrait-wrap.listening { animation: glow 0.9s ease-in-out infinite; }

        .who {
            margin: 0;
            font-family: Fraunces, Georgia, serif;
            font-size: 1.25rem;
        }

        .status, .memory-note { margin: 0; color: var(--muted); font-size: 0.95rem; }

        .fresh {
            justify-self: start;
            min-height: 44px;
            padding: 8px 2px;
            white-space: nowrap;
            border: 0;
            background: transparent;
            color: var(--leaf);
            font: inherit;
            font-weight: 750;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .chat {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 12px 12px;
        }

        .messages {
            flex: 1;
            min-height: 140px;
            overflow-y: auto;
            padding: 4px 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble {
            max-width: min(100%, 42rem);
            padding: 12px 14px;
            border-radius: 18px;
            line-height: 1.45;
        }

        .bubble.user {
            align-self: flex-end;
            background: #e5f0e2;
            border-bottom-right-radius: 6px;
        }

        .bubble.assistant {
            align-self: flex-start;
            background: #fff;
            border: 1px solid var(--line);
            border-bottom-left-radius: 6px;
        }

        .who-said {
            display: block;
            margin-bottom: 3px;
            color: var(--moss);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dots { display: flex; gap: 5px; padding-top: 4px; }
        .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--leaf);
            animation: blink 1.2s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.3s; }

        .note {
            margin: 8px 4px 0;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f8ece6;
            color: #6d3b32;
        }

        .composer {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        input[type="text"] {
            width: 100%;
            min-height: 52px;
            border-radius: 16px;
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            padding: 12px 14px;
        }

        button {
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mic, .send, .stop {
            min-height: 52px;
            border-radius: 16px;
            border: 0;
        }

        .mic {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--leaf);
            color: #fff;
            display: grid;
            place-items: center;
        }

        .mic.listening { background: #8d4b58; }

        .send, .stop {
            min-width: 76px;
            padding: 0 16px;
            background: var(--leaf);
            color: #fff;
            font-weight: 750;
        }

        .stop {
            grid-column: 1 / -1;
            background: var(--leaf-deep);
        }

        button:disabled { opacity: 0.55; cursor: wait; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        @keyframes glow {
            50% { box-shadow: 0 0 0 6px rgba(31, 74, 56, 0.16); }
        }

        @keyframes blink {
            50% { opacity: 0.35; }
        }

        @media (min-width: 860px) {
            .page { padding: 28px 28px 32px; }
            .layout {
                display: grid;
                grid-template-columns: 300px minmax(0, 1fr);
                gap: 24px;
                align-items: stretch;
            }
            .host {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                gap: 8px;
                padding: 28px 24px;
                position: sticky;
                top: 24px;
            }
            .portrait-wrap {
                width: 210px;
                height: 210px;
                margin-bottom: 8px;
            }
            .who { font-size: 2rem; }
            .chat { min-height: 640px; padding: 22px; }
            .messages { min-height: 420px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="site-header">
            <p class="eyebrow">A quiet place to talk</p>
            <h1>Shaley Gardens</h1>
        </header>
        <main class="layout">
            <section class="host" aria-label="Shaley">
                <div class="portrait-wrap" id="portraitWrap">
                    <img class="portrait" src="assets/shaley.jpg" width="768" height="768" alt="Illustrated portrait of Shaley, a woman in a garden">
                </div>
                <p class="who">Shaley</p>
                <p class="status" id="statusText">Ready when you are</p>
                <p class="memory-note">She remembers this visit.</p>
                <button class="fresh" id="freshBtn" type="button">Start fresh</button>
            </section>
            <section class="chat" aria-label="Conversation">
                <div class="messages" id="chatMessages" role="log" aria-relevant="additions"></div>
                <div id="errorContainer" aria-live="polite"></div>
                <form class="composer" id="composer">
                    <button class="mic" id="micBtn" type="button" aria-label="Start listening">
                        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                            <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/>
                        </svg>
                    </button>
                    <label class="sr-only" for="textInput">Message Shaley</label>
                    <input id="textInput" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="Type a message, or tap the microphone" maxlength="2000">
                    <button class="send" id="sendBtn" type="submit">Send</button>
                    <button class="stop" id="stopBtn" type="button" hidden>Stop speaking</button>
                </form>
            </section>
        </main>
    </div>
    <script>
        const GREETING = "Hello. I'm Shaley. Tell me what's on your mind. You can tap the microphone, or type if you prefer.";
        const MEMORY_KEY = 'shaley-gardens-visit';
        const SILENT_WAV = 'data:audio/wav;base64,UklGRmQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
        const FEMALE_HINTS = ['aria', 'jenny', 'sara', 'sonia', 'libby', 'samantha', 'karen', 'moira', 'fiona', 'serena', 'allison', 'ava', 'emma', 'victoria', 'zira', 'hazel', 'female'];

        const messagesEl = document.getElementById('chatMessages');
        const errorContainer = document.getElementById('errorContainer');
        const statusText = document.getElementById('statusText');
        const portraitWrap = document.getElementById('portraitWrap');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const textInput = document.getElementById('textInput');
        const audioEl = new Audio();
        audioEl.setAttribute('playsinline', '');
        audioEl.preload = 'auto';

        let memory = loadMemory();
        let recognition = null;
        let listening = false;
        let busy = false;
        let turnId = 0;
        let currentUrl = '';

        function loadMemory() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(MEMORY_KEY) || '[]');
                if (!Array.isArray(saved)) return [];
                return saved.filter((item) => item && (item.role === 'user' || item.role === 'assistant') && typeof item.text === 'string' && item.text.trim()).slice(-8);
            } catch (error) {
                return [];
            }
        }

        function saveMemory() {
            try {
                sessionStorage.setItem(MEMORY_KEY, JSON.stringify(memory.slice(-8)));
            } catch (error) {
                // Private browsing can refuse storage. The visit still works.
            }
        }

        function setStatus(text, mode) {
            statusText.textContent = text;
            portraitWrap.classList.toggle('listening', mode === 'listening');
            portraitWrap.classList.toggle('speaking', mode === 'speaking');
        }

        function showNote(message) {
            errorContainer.replaceChildren();
            const note = document.createElement('div');
            note.className = 'note';
            note.textContent = message;
            errorContainer.appendChild(note);
            setTimeout(() => {
                if (note.isConnected) note.remove();
            }, 6000);
        }

        function addBubble(role, text, remember) {
            const bubble = document.createElement('article');
            bubble.className = `bubble ${role === 'user' ? 'user' : 'assistant'}`;
            const label = document.createElement('span');
            label.className = 'who-said';
            label.textContent = role === 'user' ? 'You' : 'Shaley';
            const body = document.createElement('div');
            body.textContent = text;
            bubble.append(label, body);
            messagesEl.appendChild(bubble);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            if (remember) {
                memory.push({ role: role === 'user' ? 'user' : 'assistant', text });
                memory = memory.slice(-8);
                saveMemory();
            }
        }

        function renderTranscript() {
            messagesEl.replaceChildren();
            if (!memory.length) {
                addBubble('assistant', GREETING, false);
                return;
            }
            memory.forEach((turn) => addBubble(turn.role, turn.text, false));
        }

        function showThinking() {
            const bubble = document.createElement('article');
            bubble.className = 'bubble assistant';
            bubble.id = 'thinking';
            const label = document.createElement('span');
            label.className = 'who-said';
            label.textContent = 'Shaley';
            const dots = document.createElement('div');
            dots.className = 'dots';
            dots.setAttribute('aria-label', 'Shaley is thinking');
            for (let i = 0; i < 3; i += 1) dots.appendChild(document.createElement('span'));
            bubble.append(label, dots);
            messagesEl.appendChild(bubble);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return bubble;
        }

        function unlockAudio() {
            if (!audioEl.paused && audioEl.currentTime > 0) return;
            audioEl.src = SILENT_WAV;
            const pending = audioEl.play();
            if (pending && pending.catch) pending.catch(() => {});
        }

        function safeError(text) {
            const fallback = "Sorry, I couldn't answer just now. Please try again in a moment.";
            if (typeof text !== 'string' || text.length === 0 || text.length > 240) return fallback;
            if (/api[_ -]?key|secret|token|bearer|AIza/i.test(text)) return fallback;
            return text;
        }

        async function askShaley(message, history) {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, history }),
            });
            let data = {};
            try { data = await response.json(); } catch (error) { data = {}; }
            if (!response.ok || typeof data.message !== 'string' || !data.message.trim()) {
                throw new Error(safeError(data.error));
            }
            return data.message.trim();
        }

        function scoreVoice(voice) {
            const name = `${voice.name} ${voice.lang}`.toLowerCase();
            if (!name.includes('en')) return -1;
            let score = 0;
            if (name.includes('natural')) score += 80;
            if (name.includes('neural')) score += 70;
            if (name.includes('premium') || name.includes('enhanced')) score += 50;
            if (voice.localService === false) score += 20;
            if (FEMALE_HINTS.some((hint) => name.includes(hint))) score += 25;
            if (name.includes('google') && name.includes('english')) score += 12;
            if (voice.lang.toLowerCase().startsWith('en-us') || voice.lang.toLowerCase().startsWith('en_us')) score += 8;
            return score;
        }

        function pickVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            let best = null;
            let bestScore = 0;
            voices.forEach((voice) => {
                const score = scoreVoice(voice);
                if (score > bestScore) {
                    best = voice;
                    bestScore = score;
                }
            });
            return best;
        }

        function haltVoice() {
            audioEl.pause();
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            stopBtn.hidden = true;
        }

        function stopSpeaking() {
            turnId += 1;
            haltVoice();
            busy = false;
            sendBtn.disabled = false;
            if (!listening) setStatus('Ready when you are', 'ready');
        }

        function playWav(b64) {
            const bytes = Uint8Array.from(atob(b64), (char) => char.charCodeAt(0));
            const blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = blobUrl;
            audioEl.src = blobUrl;
            audioEl.onended = () => {
                stopBtn.hidden = true;
                if (!listening) setStatus('Ready when you are', 'ready');
            };
            return audioEl.play();
        }

        function speakWithBrowser(text, gen) {
            if (!window.speechSynthesis) {
                showNote('This browser cannot play a voice, so the reply is here to read.');
                setStatus('Ready when you are', 'ready');
                stopBtn.hidden = true;
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            const voice = pickVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = 0.96;
            utterance.onend = () => {
                if (gen !== turnId) return;
                stopBtn.hidden = true;
                if (!listening) setStatus('Ready when you are', 'ready');
            };
            utterance.onerror = () => {
                if (gen !== turnId) return;
                showNote('This browser cannot play a voice, so the reply is here to read.');
                stopBtn.hidden = true;
                setStatus('Ready when you are', 'ready');
            };
            window.speechSynthesis.speak(utterance);
        }

        async function speakReply(text, gen) {
            haltVoice();
            setStatus('Speaking', 'speaking');
            stopBtn.hidden = false;
            try {
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                    signal: AbortSignal.timeout(9000),
                });
                if (gen !== turnId) return;
                if (response.ok) {
                    const data = await response.json();
                    if (gen !== turnId) return;
                    if (typeof data.audio === 'string' && data.audio.length > 32 && data.audio.length < 4000000) {
                        await playWav(data.audio);
                        return;
                    }
                }
            } catch (error) {
                // The phone or computer voice below is the backup.
            }
            if (gen !== turnId) return;
            speakWithBrowser(text, gen);
        }

        async function submitMessage(raw) {
            const message = String(raw || '').trim();
            if (!message || busy) return;
            const gen = ++turnId;
            unlockAudio();
            stopListening();
            haltVoice();
            busy = true;
            sendBtn.disabled = true;
            const history = memory.slice(-8).map((turn) => ({ role: turn.role, text: turn.text }));
            addBubble('user', message, true);
            textInput.value = '';
            setStatus('Thinking', 'thinking');
            const thinking = showThinking();
            try {
                const reply = await askShaley(message, history);
                if (gen !== turnId) return;
                thinking.remove();
                addBubble('assistant', reply, true);
                await speakReply(reply, gen);
            } catch (error) {
                if (gen !== turnId) return;
                thinking.remove();
                showNote(safeError(error && error.message));
                setStatus('Ready when you are', 'ready');
            } finally {
                thinking.remove();
                if (gen === turnId) {
                    busy = false;
                    sendBtn.disabled = false;
                }
            }
        }

        function setupRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            const engine = new SpeechRecognition();
            engine.continuous = false;
            engine.interimResults = false;
            engine.lang = 'en-US';
            engine.onstart = () => setStatus('Listening', 'listening');
            engine.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                stopListening();
                submitMessage(transcript);
            };
            engine.onerror = (event) => {
                if (event.error === 'aborted' || event.error === 'no-speech') {
                    stopListening();
                    return;
                }
                showNote('The microphone did not catch that. You can try again, or type instead.');
                stopListening();
            };
            engine.onend = () => {
                if (!listening) return;
                try { engine.start(); } catch (error) { stopListening(); }
            };
            return engine;
        }

        function stopListening() {
            listening = false;
            micBtn.classList.remove('listening');
            micBtn.setAttribute('aria-label', 'Start listening');
            if (recognition) {
                try { recognition.stop(); } catch (error) { /* already stopped */ }
            }
            if (!busy && stopBtn.hidden) setStatus('Ready when you are', 'ready');
        }

        function startListening() {
            if (!recognition) recognition = setupRecognition();
            if (!recognition) {
                showNote('This browser can type to Shaley. For the microphone, try Chrome.');
                return;
            }
            unlockAudio();
            stopSpeaking();
            try {
                listening = true;
                recognition.start();
                micBtn.classList.add('listening');
                micBtn.setAttribute('aria-label', 'Stop listening');
            } catch (error) {
                listening = false;
                showNote('The microphone did not start. You can type a message instead.');
            }
        }

        micBtn.addEventListener('click', () => {
            if (listening) stopListening();
            else startListening();
        });

        document.getElementById('composer').addEventListener('submit', (event) => {
            event.preventDefault();
            submitMessage(textInput.value);
        });

        stopBtn.addEventListener('click', stopSpeaking);

        document.getElementById('freshBtn').addEventListener('click', () => {
            stopListening();
            stopSpeaking();
            memory = [];
            saveMemory();
            renderTranscript();
            setStatus('Ready when you are', 'ready');
        });

        if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }

        renderTranscript();
    </script>
</body>
</html>
